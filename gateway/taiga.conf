# Edge gateway for Ala-Too PM.
#
# Routes traffic between the AngularJS front, the Django REST API, the
# Node.js events server (websocket upgrade) and the protected attachments
# service. Everything lives behind a single port so the user only sees
# one URL.

upstream taiga-front      { server taiga-front:80; }
upstream taiga-back       { server taiga-back:8000; }
upstream taiga-events     { server taiga-events:8888; }
upstream taiga-protected  { server taiga-protected:8003; }

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;
    charset utf-8;

    # --- Frontend (single-page app) ---
    location / {
        proxy_pass http://taiga-front/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django REST API ---
    location /api/ {
        proxy_pass http://taiga-back/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin & static (served by the back image) ---
    location /admin/ {
        proxy_pass http://taiga-back/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /taiga/static/;
    }

    # --- User-uploaded files. Public files served directly; private go
    # through the protected sidecar which checks a short-lived token. ---
    location /media/ {
        alias /taiga/media/;
    }

    location /media/exports/ {
        internal;
        alias /taiga/media/exports/;
        add_header Content-Disposition "attachment";
    }

    location /protected/ {
        internal;
        rewrite ^/protected/(.*)$ /$1 break;
        proxy_pass http://taiga-protected;
        proxy_set_header X-Original-Uri $request_uri;
        proxy_set_header Host           $host;
    }

    # --- WebSocket events ---
    location /events {
        proxy_pass http://taiga-events/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;
    }
}
